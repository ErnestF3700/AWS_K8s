apiVersion: v1
kind: Pod
metadata:
  name: flask-test
  namespace: dev

  labels:
    app: flask-test

spec:
  containers:
    - name: flask
      image: python:3.12-slim

      ports:
        - containerPort: 5000

      command:
        - python

      args:
        - -c
        - |
          from flask import Flask
          app = Flask(__name__)

          @app.route("/")
          def hello():
              return "Hello from standalone Pod!"

          app.run(host="0.0.0.0", port=5000)