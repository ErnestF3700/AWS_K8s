apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: istiod
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system

  sources:

    - repoURL: https://istio-release.storage.googleapis.com/charts
      chart: istiod
      targetRevision: 1.28.0

      helm:
        valueFiles:
          - $values/K8s/istio/istiod-values.yaml

    - repoURL: https://github.com/ErnestF3700/AWS_K8s.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: true
      selfHeal: true