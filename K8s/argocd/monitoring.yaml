apiVersion: v1
kind: Application
metadata:
  name: monitoring
  namespace: argocd

spec:
  project: default

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision:  77.12.0  

      helm:
        valueFiles:
          - $values/monitoring/values.yaml
    
    - repoURL: https://github.com/ErnestF3700/AWS_K8s.git
      targetRevision: main
      ref: values

      syncsPolicY:
        automated:
          prune: true
          selfHeal: true
        

